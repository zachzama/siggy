name: Siggy
options:
  bundleIdPrefix: com.zachzama
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sources/Info.plist reads both from here, so there is one place to bump.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default, so the project builds on any Mac without an Apple
    # account. `make` picks up a personal "Apple Development" identity when one
    # is in the keychain — see DEV_SIGN in the Makefile.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Required by notarization, should Siggy ever ship a Developer ID build.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: "2.102.0"

targets:
  Siggy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          # Notes for whoever next re-generates the vendored decoder. Left in the
          # navigator beside the code it describes, but Xcode would otherwise
          # copy any unrecognised file into the app bundle's Resources, and a
          # developer README has no business shipping to users.
          - "Vendor/**/README.md"
    dependencies:
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Siggy
        CFBundleDisplayName: Siggy
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - fr
          - de
          - id
          - ja
          - ko
          - pt-BR
          - ru
          - zh-Hans
          - zh-Hant
          - uk
          - uz
          - tr
        LSMinimumSystemVersion: "15.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "Siggy answers your phone on this network so it can show your usage."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachzama.siggy
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_LANGUAGE: en
        # The only C in the project is the vendored Zstandard decoder, and this
        # is how Swift sees it. It is needed because Claude Desktop's HTTP cache
        # stores bodies with `content-encoding: zstd` and macOS ships no zstd
        # anywhere a signed, notarized app can reach — see
        # Sources/Vendor/zstd/README.md. Delete this line and that directory
        # together if the Desktop source is ever dropped.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Siggy-Bridging-Header.h

  SiggyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Siggy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zachzama.siggy.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Siggy:
    build:
      targets:
        Siggy: all
        SiggyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SiggyTests
